[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkit"
version = "0.1.0"
description = "A lightweight, token-frugal coding toolkit for AI agents (M1 Python prototype)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "tangniutt and contributors"}]
dependencies = [
  "tomli>=1.1; python_version < '3.11'",
  "tree-sitter-language-pack>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agentkit = "agentkit.cli:main"

[project.urls]
Homepage = "https://github.com/tangniutt/agentkit"

[tool.setuptools.packages.find]
include = ["agentkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
