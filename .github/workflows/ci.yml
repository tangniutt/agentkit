name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get install -y ripgrep bubblewrap
      - run: pip install -e .[dev]
      - run: pytest -q

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev] twine
      - run: agentkit release build
      - run: agentkit release verify dist/release-manifest.json
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Smoke wheel install
        run: |
          python -m venv "$RUNNER_TEMP/agentkit-wheel"
          "$RUNNER_TEMP/agentkit-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/agentkit-wheel/bin/python" -I -c 'import pathlib, agentkit; assert "site-packages" in str(pathlib.Path(agentkit.__file__).resolve())'
          "$RUNNER_TEMP/agentkit-wheel/bin/agentkit" doctor
      - name: Smoke sdist install
        run: |
          python -m venv "$RUNNER_TEMP/agentkit-sdist"
          "$RUNNER_TEMP/agentkit-sdist/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/agentkit-sdist/bin/python" -I -c 'import pathlib, agentkit; assert "site-packages" in str(pathlib.Path(agentkit.__file__).resolve())'
          "$RUNNER_TEMP/agentkit-sdist/bin/agentkit" doctor
      - uses: actions/upload-artifact@v4
        with:
          name: agentkit-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 14

  test-windows-direct:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .[dev]
      - run: python -m pytest -q
